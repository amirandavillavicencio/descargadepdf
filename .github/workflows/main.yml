name: Respaldo Moodle PDFs

on:
  workflow_dispatch:
    inputs:
      html_file:
        description: "Ruta del HTML dentro del repo"
        required: true
        default: "html/Editar Tema_ INTENSIVOS CIAC _ CIAC _ AULA USM.html"
      output_dir:
        description: "Carpeta de salida"
        required: true
        default: "output"

permissions:
  contents: read

jobs:
  backup-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar secretos requeridos
        env:
          MOODLE_COOKIES: ${{ secrets.MOODLE_COOKIES }}
        run: |
          if [ -z "$MOODLE_COOKIES" ]; then
            echo "Falta el secret MOODLE_COOKIES"
            exit 1
          fi
          if [ ! -f "${{ github.event.inputs.html_file }}" ]; then
            echo "No existe el HTML indicado: ${{ github.event.inputs.html_file }}"
            exit 1
          fi
          if [ ! -f "scripts/download_moodle_pdfs.py" ]; then
            echo "Falta scripts/download_moodle_pdfs.py"
            exit 1
          fi

      - name: Ejecutar descarga
        env:
          MOODLE_COOKIES: ${{ secrets.MOODLE_COOKIES }}
        run: |
          mkdir -p "${{ github.event.inputs.output_dir }}"
          python scripts/download_moodle_pdfs.py \
            --html "${{ github.event.inputs.html_file }}" \
            --out "${{ github.event.inputs.output_dir }}"

      - name: Comprimir respaldo
        run: |
          cd "${{ github.event.inputs.output_dir }}"
          zip -r ../respaldo_moodle.zip .

      - name: Subir ZIP como artifact
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-moodle-zip
          path: respaldo_moodle.zip
          if-no-files-found: error

      - name: Subir carpeta de salida como artifact
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-moodle-folder
          path: ${{ github.event.inputs.output_dir }}
          if-no-files-found: warn
