name: Respaldo Moodle PDFs

on:
  workflow_dispatch:
    inputs:
      html_file:
        description: "Ruta del HTML dentro del repo"
        required: true
        default: "html/curso_exportado.html"
      output_dir:
        description: "Carpeta de salida"
        required: true
        default: "output"
      delay:
        description: "Delay entre requests en segundos"
        required: true
        default: "0.4"
      only_pdf:
        description: "Descargar solo PDFs directos (true/false)"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  backup-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar secret y archivos de entrada
        env:
          MOODLE_COOKIES: ${{ secrets.MOODLE_COOKIES }}
        run: |
          set -euo pipefail
          if [ -z "${MOODLE_COOKIES:-}" ]; then
            echo "ERROR: Falta el secret MOODLE_COOKIES" >&2
            exit 1
          fi
          if [ ! -f "${{ github.event.inputs.html_file }}" ]; then
            echo "ERROR: No existe el HTML indicado: ${{ github.event.inputs.html_file }}" >&2
            exit 1
          fi
          if [ ! -f "scripts/download_moodle_pdfs.py" ]; then
            echo "ERROR: Falta scripts/download_moodle_pdfs.py" >&2
            exit 1
          fi

      - name: Ejecutar respaldo
        env:
          MOODLE_COOKIES: ${{ secrets.MOODLE_COOKIES }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.event.inputs.output_dir }}"
          EXTRA=""
          if [ "${{ github.event.inputs.only_pdf }}" = "true" ]; then
            EXTRA="--only-pdf"
          fi

          python scripts/download_moodle_pdfs.py \
            --html "${{ github.event.inputs.html_file }}" \
            --out "${{ github.event.inputs.output_dir }}" \
            --delay "${{ github.event.inputs.delay }}" \
            --max-workers 6 \
            ${EXTRA}

      - name: Comprimir salida
        run: |
          set -euo pipefail
          zip -r respaldo_moodle.zip "${{ github.event.inputs.output_dir }}"

      - name: Subir ZIP como artifact
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-moodle-zip
          path: respaldo_moodle.zip
          if-no-files-found: error

      - name: Subir carpeta output como artifact
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-moodle-output
          path: ${{ github.event.inputs.output_dir }}
          if-no-files-found: error
