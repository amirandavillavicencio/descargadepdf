name: Descargar PDFs Moodle

on:
  workflow_dispatch:

jobs:
  backup-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar cookies
        run: |
          if [ ! -f "aula.usm.cl_cookies.txt" ]; then
            echo "No se encontró aula.usm.cl_cookies.txt"
            exit 1
          fi

      - name: Crear carpetas de salida
        run: |
          mkdir -p output/pdfs
          mkdir -p output/logs

      - name: Ejecutar descarga desde Moodle
        run: |
          python scripts/download_moodle_pdfs.py \
            --url "https://aula.usm.cl/course/view.php?id=4401&section=23#tabs-tree-start" \
            --cookies "aula.usm.cl_cookies.txt" \
            --out "output"

      - name: Comprimir resultados
        run: |
          cd output
          zip -r ../moodle_backup.zip .

      - name: Subir ZIP como artifact
        uses: actions/upload-artifact@v4
        with:
          name: moodle-backup
          path: moodle_backup.zip
          if-no-files-found: warn
