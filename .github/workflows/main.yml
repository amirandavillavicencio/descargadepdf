name: Descargar PDFs Moodle

on:
  workflow_dispatch:

jobs:
  backup-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear carpetas de salida
        run: |
          mkdir -p output/pdfs
          mkdir -p output/logs

      - name: Detectar archivo HTML
        id: detect_html
        shell: bash
        run: |
          HTML_FILE=$(find . -maxdepth 3 -type f \( -iname "*.html" -o -iname "*.htm" \) | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "No se encontró ningún archivo HTML en el repositorio."
            exit 1
          fi
          echo "html_file=$HTML_FILE" >> $GITHUB_OUTPUT
          echo "HTML detectado: $HTML_FILE"

      - name: Verificar archivo de cookies
        shell: bash
        run: |
          if [ ! -f "aula.usm.cl_cookies.txt" ]; then
            echo "No se encontró el archivo aula.usm.cl_cookies.txt en la raíz del repositorio."
            exit 1
          fi
          echo "Archivo de cookies encontrado."

      - name: Ejecutar descarga
        run: |
          python scripts/download_moodle_pdfs.py \
            --html "${{ steps.detect_html.outputs.html_file }}" \
            --cookies "aula.usm.cl_cookies.txt" \
            --out "output"

      - name: Comprimir resultados
        run: |
          cd output
          zip -r ../moodle_backup.zip .

      - name: Subir ZIP como artifact
        uses: actions/upload-artifact@v4
        with:
          name: moodle-backup
          path: moodle_backup.zip
          if-no-files-found: error
